name: Simple CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  Project build check CI:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: |
        mvn clean package
        ls -al
        ls -al target

  shell-commands:
    needs: "Project build check CI"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Run shell commands
      run: |
        echo "CI Job completed successfully!"
        echo "Running some shell commands..."
        pwd
        whoami
        date
